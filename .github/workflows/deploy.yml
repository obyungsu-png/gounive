# main 브랜치에 push하면 사이트를 빌드해 GitHub Pages에 배포합니다.
# 최초 1회: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 선택하세요.
# Supabase 서버 모드: Settings → Secrets and variables → Actions → Variables 에
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY 를 등록하면 빌드에 반영됩니다. (비우면 데모 모드)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
