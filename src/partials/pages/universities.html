<div class="info-overlay" id="univOverlay">

    <i class="fas fa-home clickable" onclick="showHome()"></i>
    <span class="bc-sep">›</span><a href="#" onclick="showHome()">대학/학과/전형</a>
    <span class="bc-sep">›</span><a href="#">대학정보</a>

  <div class="info-hero"><h1>대학정보</h1></div>

  <div class="info-body">
    <!-- 필터 -->
    <div class="info-filter">
      <div class="tab-row">
        <button class="tab-btn active">일반대학</button>
        <button class="tab-btn">전문대학</button>
      </div>
      <div class="filter-select-box">
        <select>
          <option>2027학년도(현재 고3)</option>
          <option>2026학년도(현재 고2)</option>
        </select>
      </div>
      <div class="filter-input-row">
        <input type="text" id="univSearchInput" placeholder="대학명을 입력해주세요." oninput="filterUnivTable(this.value)">
        <button onclick="filterUnivTable(document.getElementById('univSearchInput').value)" aria-label="검색"><i class="fas fa-search"></i></button>
      </div>
      <div class="filter-apply-row">

      <div class="filter-action-row">
        <button class="btn-reset">검색조건 초기화</button>
        <button class="btn-save">검색조건 저장</button>
      </div>
      <button class="filter-link-btn">검색조건설정 바로가기</button>
    </div>

    <!-- 테이블 -->
    <div class="info-table-area">
      <div class="table-top-row">
        <div class="table-summary">총 <strong id="univTotal">220건</strong></div>
        <select class="table-view-select"><option>대학목록 ∨</option></select>
      </div>
      <table class="info-table">
        <thead>
          <tr>
            <th>대학명 <span class="sort-icon">▾</span></th>
            <th>지역 <span class="sort-icon">▾</span></th>

            <th>설치학과 <span class="sort-icon">▾</span></th>
            <th>전형정보 <span class="sort-icon">▾</span></th>
            <th>비교</th>
            <th>★</th>
          </tr>
        </thead>
        <tbody id="univTableBody"></tbody>
      </table>
      <div class="pagination" id="univPagination"></div>
    </div>
